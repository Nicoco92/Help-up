name: helpup

# Les secrets viennent du fichier .env à la racine (non versionné, voir .env.example).
# La syntaxe ${VAR:?msg} fait échouer le démarrage si une variable manque.

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?définir MONGO_ROOT_USER dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?définir MONGO_ROOT_PASSWORD dans .env}
      MONGO_APP_DB: ${MONGO_APP_DB:-helpup}
      MONGO_APP_USER: ${MONGO_APP_USER:?définir MONGO_APP_USER dans .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?définir MONGO_APP_PASSWORD dans .env}
    ports:
      # Uniquement depuis la machine (pour Compass/mongosh), pas depuis le réseau.
      # En production : supprimer ce bloc, seul le backend a besoin d'y accéder.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DB:-helpup}?authSource=${MONGO_APP_DB:-helpup}
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:22-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

  # Outil d'admin, lancé seulement avec : docker compose --profile tools up
  # Ne jamais le déployer en production.
  mongo-express:
    image: mongo-express:1.0.2
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:?définir ME_USER dans .env}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:?définir ME_PASSWORD dans .env}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
  backend-node-modules:
  frontend-node-modules:
