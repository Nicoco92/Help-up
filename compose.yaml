name: helpup

# PRODUCTION (fichier par défaut de docker compose) :
#   docker compose up -d --build
# Pour développer : docker compose -f compose.dev.yaml up -d
# Seul prérequis : le .env à la racine (voir .env.example).
# Même nom de projet que le dev : le volume helpup_mongo-data (la base) est partagé entre les deux.
#
# Différences avec le dev :
#   - images construites (Dockerfile), plus de code monté ni de npm install au démarrage ;
#   - backend : NODE_ENV=production, `node dist/server.js` (JWT_SECRET < 32 caractères = refus de démarrer) ;
#   - frontend : build Vite servi par nginx, qui relaie aussi /api vers le backend (même origine) ;
#   - seul nginx est publié (127.0.0.1:5173, cible du tunnel Cloudflare) ; Mongo et l'API ne le sont pas ;
#   - pas de mongo-express ;
#   - journaux des conteneurs plafonnés (rotation), durée annoncée dans la page Confidentialité.

# Rotation des journaux (IP, pages demandées…) : 3 fichiers de 10 Mo par conteneur, les plus anciens effacés.
# À garder synchronisé avec LOG_RETENTION (frontend/src/constants/legal.ts).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    logging: *logging
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?définir MONGO_ROOT_USER dans .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?définir MONGO_ROOT_PASSWORD dans .env}
      MONGO_APP_DB: ${MONGO_APP_DB:-helpup}
      MONGO_APP_USER: ${MONGO_APP_USER:?définir MONGO_APP_USER dans .env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?définir MONGO_APP_PASSWORD dans .env}
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: helpup-backend:prod
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?définir JWT_SECRET dans .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      # Le front est servi sur la même origine que l'API (nginx) : cette liste ne sert qu'aux autres clients
      CORS_ORIGIN: ${CORS_ORIGIN:-https://helpup.lesfarfadets.net}
      # Vide dans .env = la base Mongo de ce fichier, avec le compte applicatif
      MONGODB_URI: ${MONGODB_URI:-mongodb://${MONGO_APP_USER}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_APP_DB:-helpup}?authSource=${MONGO_APP_DB:-helpup}}
      # Un seul proxy de confiance : nginx, qui recopie CF-Connecting-IP dans X-Forwarded-For
      # (frontend/nginx/default.conf). Lié à cette topologie, donc fixé ici et pas dans .env.
      TRUST_PROXY: 1
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        # Même origine que le site : nginx relaie /api (la CSP reste connect-src 'self')
        VITE_API_URL: /api
    image: helpup-frontend:prod
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
