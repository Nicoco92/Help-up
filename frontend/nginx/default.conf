# Production : sert le build Vite (SPA) et relaie /api vers le backend.
# Chaîne : navigateur → Cloudflare → cloudflared (VPS) → 127.0.0.1:5173 → nginx → backend:3000

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interne de Docker, résolu à chaque requête : nginx démarre même si le backend est absent
    # et suit sa nouvelle IP quand il est recréé.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API : les en-têtes de sécurité viennent de helmet, nginx n'en ajoute pas.
    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP réelle du visiteur, fournie par Cloudflare (non falsifiable à travers le tunnel) ;
        # le backend fait confiance à un seul proxy (TRUST_PROXY=1) pour la limitation de débit.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Fichiers avec empreinte dans le nom (assets/index-abc123.js) : cache long
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Routes React (react-router) : tout le reste renvoie index.html, jamais mis en cache
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
