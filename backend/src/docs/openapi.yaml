# Documentation de l'API HelpUP (OpenAPI 3), servie sur /api/docs
# Chacun ajoute ses routes dans `paths` et ses objets dans `components.schemas`.
openapi: 3.0.3
info:
  title: HelpUP API
  version: 1.0.0
  description: |
    API de mini-jobs entre voisins.
    Les routes métier exigent `Authorization: Bearer <JWT>` (bouton « Authorize »).
    Toutes les erreurs ont le format `{"error":{"code","message"}}`.
servers:
  - url: http://localhost:3000

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Missions
  - name: Explore
  - name: Applications

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Vérifie que l'API répond
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [INVALID_INPUT, UNAUTHORIZED, NOT_FOUND, EMAIL_ALREADY_USED, CONFLICT, INTERNAL_ERROR]
            message: { type: string }

    Mission:
      type: object
      properties:
        id: { type: string, example: 6650f0c2a1b2c3d4e5f60789 }
        ownerId: { type: string }
        providerId: { type: string, nullable: true }
        title: { type: string, minLength: 5, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 1000 }
        rewardCents: { type: integer, minimum: 500, maximum: 50000, description: Montant en centimes }
        estimatedMinutes: { type: integer, minimum: 15, maximum: 480 }
        category: { type: string, example: jardinage }
        scheduledAt: { type: string, format: date-time }
        quartier: { type: string, example: villejuif-centre }
        location:
          type: object
          properties:
            type: { type: string, enum: [Point] }
            coordinates: { type: array, items: { type: number }, example: [2.364, 48.7875] }
        status: { type: string, enum: [open, assigned, completed, cancelled] }
        urgent: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Application:
      type: object
      properties:
        id: { type: string }
        missionId: { type: string }
        applicantId: { type: string }
        message: { type: string, minLength: 10, maxLength: 500 }
        status: { type: string, enum: [pending, accepted, rejected, withdrawn] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

  # Réponses d'erreur réutilisables : $ref: '#/components/responses/NotFound'
  responses:
    InvalidInput:
      description: Donnée invalide, champ inconnu ou id mal formé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Objet absent ou appartenant à un autre utilisateur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Doublon (email déjà utilisé, candidature déjà envoyée)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

# Par défaut, toutes les routes exigent le JWT (mettre `security: []` sur une route publique)
security:
  - bearerAuth: []
