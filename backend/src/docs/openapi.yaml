# Documentation de l'API HelpUP (OpenAPI 3), servie sur /api/docs
# Chacun ajoute ses routes dans `paths` et ses objets dans `components.schemas`.
openapi: 3.0.3
info:
  title: HelpUP API
  version: 1.0.0
  description: |
    API de mini-jobs entre voisins.
    Les routes métier exigent `Authorization: Bearer <JWT>` (bouton « Authorize »).
    Toutes les erreurs ont le format `{"error":{"code","message"}}`.
servers:
  - url: http://localhost:3000

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Missions
  - name: Explore
  - name: Applications
  - name: Dashboard
  - name: Reviews
  - name: Notifications

paths:
  /api/health:
    get:
      tags: [Health]
      summary: Vérifie que l'API répond
      security: []
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # --- Candidatures (Romain) ---
  /api/applications:
    get:
      tags: [Applications]
      summary: Mes candidatures (les plus récentes d'abord)
      responses:
        '200':
          description: Liste, vide si aucune candidature
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApplicationWithMission' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Applications]
      summary: Postuler à une mission
      description: |
        Règles : mission existante (404), ouverte (400), pas la sienne (400), une seule candidature par mission (409 CONFLICT).
        `applicantId` et `status` sont fixés par le serveur : les envoyer renvoie 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationInput' }
      responses:
        '201':
          description: Candidature créée (status pending)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationWithMission' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/applications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Applications]
      summary: Une de mes candidatures
      responses:
        '200':
          description: Candidature
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationWithMission' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Applications]
      summary: Modifier le message (candidature en attente uniquement)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              additionalProperties: false
              properties:
                message: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200':
          description: Candidature modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationWithMission' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Applications]
      summary: Retirer ma candidature (en attente uniquement)
      responses:
        '204': { description: Candidature retirée }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/missions/{id}/applications:
    parameters:
      - { name: id, in: path, required: true, description: Id d'une de MES missions, schema: { type: string } }
    get:
      tags: [Applications]
      summary: Candidats d'une de mes missions (profil public, sans email ni téléphone)
      responses:
        '200':
          description: Liste des candidatures, de la plus ancienne à la plus récente
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ApplicationWithApplicant' } }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/missions/{id}/applications/{applicationId}/accept:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: applicationId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Applications]
      summary: Accepter un candidat
      description: La mission passe `assigned` avec `providerId` = le candidat ; les autres candidatures en attente passent `rejected`.
      responses:
        '200':
          description: Candidature acceptée, avec la mission mise à jour
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationWithMission' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/missions/{id}/applications/{applicationId}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: applicationId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Applications]
      summary: Refuser un candidat (la mission reste ouverte)
      responses:
        '200':
          description: Candidature refusée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApplicationWithMission' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- Suivi des missions (Romain) ---
  /api/missions/{id}/complete:
    parameters:
      - { name: id, in: path, required: true, description: Id d'une de MES missions, schema: { type: string } }
    post:
      tags: [Missions]
      summary: Marquer une mission attribuée comme terminée (propriétaire uniquement)
      description: "`assigned` → `completed`, avec `completedAt`. Une mission ouverte ou déjà terminée renvoie 400 ; celle d'un autre membre, 404."
      responses:
        '200':
          description: Mission terminée
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MissionSummary'
                  - type: object
                    properties:
                      completedAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/dashboard:
    get:
      tags: [Dashboard]
      summary: Tableau de bord de l'utilisateur connecté
      description: Missions publiées en cours (avec le nombre de candidatures), missions obtenues, historique des missions terminées et statistiques.
      responses:
        '200':
          description: Tableau de bord
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # --- Avis (Romain) ---
  /api/reviews:
    get:
      tags: [Reviews]
      summary: Les avis que j'ai écrits (les plus récents d'abord)
      responses:
        '200':
          description: Liste, vide si aucun avis
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReviewWithTarget' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Reviews]
      summary: Noter l'autre participant d'une mission terminée
      description: |
        Je dois être le client ou le prestataire de la mission (sinon 404), elle doit être terminée (400), un seul avis par mission (409 CONFLICT).
        `authorId` vient du JWT et `targetId` est déduit de la mission : les envoyer renvoie 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Avis créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewWithTarget' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/reviews/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Reviews]
      summary: Un de mes avis
      responses:
        '200':
          description: Avis
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewWithTarget' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Reviews]
      summary: Modifier la note ou le commentaire (au moins un des deux)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Avis modifié
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewWithTarget' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Reviews]
      summary: Supprimer un de mes avis
      responses:
        '204': { description: Avis supprimé }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/users/{id}/reviews:
    parameters:
      - { name: id, in: path, required: true, description: Id d'un membre, schema: { type: string } }
    get:
      tags: [Reviews]
      summary: Avis reçus par un membre et sa note moyenne
      responses:
        '200':
          description: Les 50 derniers avis reçus et la note moyenne (null si aucun avis)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ReviewWithAuthor' } }
                  summary:
                    type: object
                    properties:
                      average: { type: number, nullable: true, example: 4.5 }
                      count: { type: integer, example: 2 }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # --- Notifications (Romain) ---
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Mes 50 dernières notifications et le nombre de non lues
      description: |
        Créées uniquement par le serveur : nouvelle mission près de chez moi (même ville + compétence), candidature reçue,
        acceptée ou refusée, mission terminée, avis reçu. Supprimées automatiquement après 90 jours.
      parameters:
        - { name: unread, in: query, required: false, description: true = seulement les non lues, schema: { type: string, enum: ['true', 'false'] } }
      responses:
        '200':
          description: Liste, vide si aucune notification
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer, example: 2 }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Nombre de notifications non lues (pastille de la cloche)
      responses:
        '200':
          description: Compteur
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Tout marquer comme lu
      responses:
        '200':
          description: Nombre de notifications passées en lues
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer, example: 2 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/notifications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [Notifications]
      summary: Une de mes notifications
      responses:
        '200':
          description: Notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Notifications]
      summary: Marquer comme lue ou non lue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              additionalProperties: false
              properties:
                read: { type: boolean }
      responses:
        '200':
          description: Notification modifiée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Notifications]
      summary: Supprimer une de mes notifications
      responses:
        '204': { description: Notification supprimée }
        '400': { $ref: '#/components/responses/InvalidInput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum: [INVALID_INPUT, UNAUTHORIZED, FORBIDDEN, NOT_FOUND, EMAIL_ALREADY_USED, CONFLICT, INTERNAL_ERROR]
            message: { type: string }

    Mission:
      type: object
      properties:
        id: { type: string, example: 6650f0c2a1b2c3d4e5f60789 }
        ownerId: { type: string }
        providerId: { type: string, nullable: true }
        title: { type: string, minLength: 5, maxLength: 80 }
        description: { type: string, minLength: 10, maxLength: 1000 }
        rewardCents: { type: integer, minimum: 500, maximum: 50000, description: Montant en centimes }
        estimatedMinutes: { type: integer, minimum: 15, maximum: 480 }
        category: { type: string, example: jardinage }
        scheduledAt: { type: string, format: date-time }
        quartier: { type: string, example: villejuif-centre }
        location:
          type: object
          properties:
            type: { type: string, enum: [Point] }
            coordinates: { type: array, items: { type: number }, example: [2.364, 48.7875] }
        status: { type: string, enum: [open, assigned, completed, cancelled] }
        urgent: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Application:
      type: object
      properties:
        id: { type: string }
        missionId: { type: string }
        applicantId: { type: string }
        message: { type: string, minLength: 10, maxLength: 500 }
        status: { type: string, enum: [pending, accepted, rejected, withdrawn] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApplicationInput:
      type: object
      required: [missionId, message]
      additionalProperties: false
      properties:
        missionId: { type: string, example: 6650f0c2a1b2c3d4e5f60789 }
        message: { type: string, minLength: 10, maxLength: 500, example: Bonjour, je suis disponible samedi matin. }

    MissionSummary:
      type: object
      properties:
        id: { type: string }
        ownerId: { type: string }
        providerId: { type: string, nullable: true }
        title: { type: string }
        status: { type: string, enum: [open, assigned, completed, cancelled] }
        rewardCents: { type: integer }
        estimatedMinutes: { type: integer }
        category: { type: string }
        categoryLabel: { type: string }
        quartier: { type: string }
        quartierLabel: { type: string }
        scheduledAt: { type: string, format: date-time }
        urgent: { type: boolean }

    ApplicationWithMission:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          properties:
            mission: { allOf: [{ $ref: '#/components/schemas/MissionSummary' }], nullable: true }

    ApplicationWithApplicant:
      allOf:
        - $ref: '#/components/schemas/Application'
        - type: object
          properties:
            applicant:
              type: object
              nullable: true
              properties:
                id: { type: string }
                firstName: { type: string }
                lastName: { type: string, description: Initiale seulement, example: D. }
                city: { type: string }
                avatarUrl: { type: string }
                skills: { type: array, items: { type: string } }

    DashboardMission:
      allOf:
        - $ref: '#/components/schemas/MissionSummary'
        - type: object
          properties:
            completedAt: { type: string, format: date-time, nullable: true }
            role: { type: string, enum: [owner, provider], description: owner = je l'ai publiée, provider = je la réalise }
            pendingApplications: { type: integer }
            totalApplications: { type: integer }
            counterpart:
              allOf: [{ $ref: '#/components/schemas/PublicPerson' }]
              nullable: true
              description: Le prestataire retenu (mes missions) ou le client (missions obtenues)
            myReview:
              type: object
              nullable: true
              description: Missions terminées — mon avis sur l'autre participant (null = pas encore noté)
              properties:
                id: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string }

    Dashboard:
      type: object
      properties:
        stats:
          type: object
          properties:
            openMissions: { type: integer }
            pendingApplications: { type: integer }
            obtainedMissions: { type: integer }
            completedMissions: { type: integer }
            earnedCents: { type: integer, description: Total gagné comme prestataire, en centimes }
        published: { type: array, items: { $ref: '#/components/schemas/DashboardMission' } }
        obtained: { type: array, items: { $ref: '#/components/schemas/DashboardMission' } }
        history: { type: array, items: { $ref: '#/components/schemas/DashboardMission' } }

    PublicPerson:
      type: object
      properties:
        id: { type: string }
        firstName: { type: string }
        lastName: { type: string, description: Initiale seulement, example: D. }
        city: { type: string }
        avatarUrl: { type: string }

    Review:
      type: object
      properties:
        id: { type: string }
        missionId: { type: string }
        authorId: { type: string }
        targetId: { type: string, description: L'autre participant de la mission, déduit par le serveur }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        mission:
          type: object
          nullable: true
          properties:
            id: { type: string }
            title: { type: string }
            category: { type: string }

    ReviewInput:
      type: object
      required: [missionId, rating]
      additionalProperties: false
      properties:
        missionId: { type: string, example: 6650f0c2a1b2c3d4e5f60789 }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, maxLength: 500, example: Ponctuel et très soigneux. }

    ReviewWithTarget:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            target: { allOf: [{ $ref: '#/components/schemas/PublicPerson' }], nullable: true }

    ReviewWithAuthor:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            author: { allOf: [{ $ref: '#/components/schemas/PublicPerson' }], nullable: true }

    Notification:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [mission_nearby, application_received, application_accepted, application_rejected, mission_completed, review_received]
        message: { type: string, example: Bob N. a postulé à « Monter une armoire ». }
        link: { type: string, description: Page du front à ouvrir, example: /dashboard }
        missionId: { type: string, nullable: true }
        read: { type: boolean }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

  # Réponses d'erreur réutilisables : $ref: '#/components/responses/NotFound'
  responses:
    InvalidInput:
      description: Donnée invalide, champ inconnu ou id mal formé
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Objet absent ou appartenant à un autre utilisateur
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Doublon (email déjà utilisé, candidature ou avis déjà envoyé)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

# Par défaut, toutes les routes exigent le JWT (mettre `security: []` sur une route publique)
security:
  - bearerAuth: []
