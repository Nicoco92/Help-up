# Reusable error responses. Referenced as '../openapi.yaml#/components/responses/<Name>'.
# Error messages are returned in French: the frontend displays them as is.
InvalidInput:
  description: Invalid data, unknown field, `id`/`ownerId` in the body, or malformed id
  content:
    application/json:
      schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
      example: { error: { code: INVALID_INPUT, message: Le titre doit contenir au moins 5 caractères } }

Unauthorized:
  description: Missing, invalid or expired token
  content:
    application/json:
      schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
      example: { error: { code: UNAUTHORIZED, message: Authentification requise ou invalide } }

Forbidden:
  description: Action restricted to administrators
  content:
    application/json:
      schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
      example: { error: { code: FORBIDDEN, message: Action réservée aux administrateurs } }

NotFound:
  description: Missing object, or object owned by another user (same response in both cases)
  content:
    application/json:
      schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
      example: { error: { code: NOT_FOUND, message: Mission introuvable } }

Conflict:
  description: Duplicate (email, application or review already sent) or incompatible state (mission no longer `open`, ongoing mission…)
  content:
    application/json:
      schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
      example: { error: { code: CONFLICT, message: Seule une mission ouverte peut être modifiée } }

PayloadTooLarge:
  description: Request body larger than 100 kB
  content:
    application/json:
      schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
      example: { error: { code: PAYLOAD_TOO_LARGE, message: Requête trop volumineuse (100 ko maximum) } }

TooManyRequests:
  description: |
    Rate limit reached (per IP): login 10 failures / 15 min (successful logins are not counted),
    register 20 / hour, whole API 300 / minute. `Retry-After` and `RateLimit` headers tell when to retry.
  headers:
    Retry-After: { schema: { type: integer }, description: Seconds before retrying }
  content:
    application/json:
      schema: { $ref: '../openapi.yaml#/components/schemas/Error' }
      example: { error: { code: TOO_MANY_REQUESTS, message: Trop de tentatives de connexion. Réessaie dans 15 minutes. } }
